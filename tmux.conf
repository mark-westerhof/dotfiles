# Set prefix
unbind C-b
set -g prefix C-a

# TERM setup. tmux-256color gives inner apps italics and undercurl; macOS's
# ncurses has no such entry, so it stays on screen-256color there.
set -g default-terminal "screen-256color"
if-shell 'infocmp tmux-256color >/dev/null 2>&1' 'set -g default-terminal "tmux-256color"'
set -ag terminal-features ",screen-256color:RGB"
# Ghostty: truecolor, OSC 52 clipboard and styled (curly) underlines.
set -ag terminal-features ",xterm-ghostty:RGB:clipboard:usstyle"
# Tell tmux that outer alacritty supports truecolor. tmux 3.4's default
# terminal-features list doesn't include alacritty, and the system
# alacritty terminfo entry lacks the RGB cap, so without this tmux
# downgrades truecolor codes from nvim/opencode to a 256-color
# approximation (~#262626) that doesn't match the alacritty bg (#282c34).
set -ag terminal-features ",alacritty*:RGB"

# Declare clipboard (OSC 52) support for the outer alacritty so tmux's
# set-clipboard below actually emits OSC 52 outward. alacritty's system
# terminfo doesn't expose Ms, so without this declaration tmux gates the
# emit and yanks never reach the host pasteboard.
set -ag terminal-features ",alacritty*:clipboard"


# Toggle last window like screen
bind-key C-a last-window

# Kill session/server
bind-key k confirm kill-session
bind-key K confirm kill-server

# Clear pane
bind-key C send-keys -R

# Remove delay when switching vim modes
set -sg escape-time 0

# Required for clipboard integration with vim
set-option -g focus-events on

# Swallow bells entirely. alacritty has no option to suppress the macOS dock
# attention request it fires on BEL when unfocused, so the icon bounces every
# time something inside tmux beeps (claude notifications, readline, ...).
# bell-action none makes tmux ignore pane bells instead of re-ringing them at
# the outer terminal; monitor-bell off stops the window flag as well.
set -g bell-action none
set -g visual-bell off
setw -g monitor-bell off

# Click to focus panes, drag borders to resize, and forward mouse events to apps.
set -g mouse on

# Accept plain OSC 52 from inner apps (claude, codex, nvim) into the tmux
# paste buffer, and emit OSC 52 outward on copy-mode yanks so they reach the
# host pasteboard. The outward emit relies on the alacritty Ms override above.
set-option -g set-clipboard on

# opencode doesn't send plain OSC 52: once it sees $TMUX it wraps the
# sequence in DCS passthrough (\ePtmux;...\e\\), which tmux drops unless
# passthrough is allowed. With this on, its copies go straight to alacritty
# (bypassing the tmux paste buffer). Only the visible pane may pass through.
set -g allow-passthrough on

# Smart pane switching with awareness of vim splits
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?\.?(view|n?vim?x?)(-wrapped)?(diff)?$'"

bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' { if -F '#{pane_at_left}' '' 'select-pane -L' }
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' { if -F '#{pane_at_bottom}' '' 'select-pane -D' }
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' { if -F '#{pane_at_top}' '' 'select-pane -U' }
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' { if -F '#{pane_at_right}' '' 'select-pane -R' }

bind-key -T copy-mode-vi 'C-h' if -F '#{pane_at_left}' '' 'select-pane -L'
bind-key -T copy-mode-vi 'C-j' if -F '#{pane_at_bottom}' '' 'select-pane -D'
bind-key -T copy-mode-vi 'C-k' if -F '#{pane_at_top}' '' 'select-pane -U'
bind-key -T copy-mode-vi 'C-l' if -F '#{pane_at_right}' '' 'select-pane -R'
bind-key -T copy-mode-vi 'C-n' if -F '#{window_end_flag}' '' 'select-window -n'
bind-key -T copy-mode-vi 'C-p' if 'test #{window_index} -gt #{base-index}' 'select-window -p'

# Resize panes
bind-key -r -T prefix C-[ resize-pane -U 5
bind-key -r -T prefix C-] resize-pane -D 5

# Vim like copy & paste
setw -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection

# Open a man page in new window
bind / command-prompt "split-window 'exec man %%'"

# Quick view of processes
bind '`' split-window "exec htop"

# Claude shortcut
bind-key -T prefix a send-keys -l ,cbf\; display-menu -T "Run claude on file?" File f "split-window -h\; send-keys -l 'claude '\; paste-buffer\; send-keys -l ' '\; send-key Enter" \
Component c "split-window -h\; send-keys -l 'echo '\; paste-buffer\; send-keys -l ' | sed \"s/\.component\..*$/.component.*/\" | xargs -I {} claude {}'\; send-key Enter" \
No n "display-message Declined"

# Host identity: lavender on the dev server, orange on the Mac, so the two
# tmux instances can't be mixed up. Same file on both machines.
if-shell 'test "$(uname)" = Darwin' \
  'set -g @host_accent "#d19a66" ; set -g @host_label MAC' \
  'set -g @host_accent "#b4befe" ; set -g @host_label DEV'

# Colors (One Dark)
BG='#282c34'
BAR_BG='#21252b'
SEG_BG='#2c313a'
FG='#abb2bf'
MUTED='#7f848e'
BORDER='#3b4048'
PREFIX='#98c379'

# Border
set -g pane-border-style fg=$BORDER
set -g pane-active-border-style "fg=#{@host_accent}"

# Number windows from 1 and close gaps; windows are named after their process.
# Claude's binary is named after its version (2.1.287), so that reads as claude.
set -g base-index 1
set -g renumber-windows on
setw -g automatic-rename-format '#{?#{m/r:^[0-9]+\.[0-9]+\.[0-9]+$,#{pane_current_command}},claude,#{pane_current_command}}'

# Minimal status line (after binoymanoj/tmux-minimal-theme): no fills, only
# colour. The host accent marks this machine and turns green while the prefix is held.
DIM='#5c6370'
set -gu status-format
# Two status rows: an empty one on top as spacing between the panes and the
# bar, with the default bar moved down into the second row.
set -g status 2
run 'tmux show -g status-format[0] | sed "s/^status-format\[0\]/set -g status-format[1]/" | tmux source -'
set -g status-format[0] ''
set -g status-position bottom
set -g status-justify left
set -g status-style bg=$BG,fg=$FG
set -g status-left-length 100
set -g status-right-length 120
setw -g monitor-activity off
setw -g window-status-style default
setw -g window-status-separator ''
set -g status-left "#[fg=#{?client_prefix,$PREFIX,#{@host_accent}},bold]   #S #[nobold]#[fg=$DIM]│ "
setw -g window-status-format "#[fg=$MUTED] #I:#W "
setw -g window-status-current-format "#[fg=#{@host_accent},bold] #I:#W "
# Git state of the active pane's repo (bin/tmux-git-status), then the clock.
# #() runs async, so a slow repo only leaves the segment briefly stale.
set -g status-interval 5
set -g status-right "#(~/.local/bin/tmux-git-status '#{pane_current_path}' '#{@host_accent}')#[fg=#{@host_accent}] #[fg=$FG]%H:%M "

# Selection in the session/window switcher and copy mode: host accent
# instead of tmux's default yellow
set -gF mode-style "bg=#{@host_accent},fg=$BG"

# Messages and confirm prompts: host accent, centred on the spacer row, with
# the rest of the row filled so it doesn't show through
set -gF message-style "bg=#{@host_accent},fg=$BG,bold,align=centre,fill=$BG"
set -g message-command-style bg=$SEG_BG,fg=$FG

# Outer terminal title, e.g. "DEV · main"
set -g set-titles on
set -g set-titles-string "#{@host_label} · #S"
